[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(self)"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"

[build]
  publish = "."
  functions = "netlify/functions"
  # CrowdStamp Pro demo (Vite/React) bouwen en onder /demo publiceren
  command = "cd demo-pro && npm ci && npm run build && rm -rf ../demo && cp -r dist ../demo"

# SPA-fallback voor de demo
[[redirects]]
  from = "/demo/*"
  to = "/demo/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/app"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true
